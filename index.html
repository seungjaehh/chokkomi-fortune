<!doctype html>
<html lang="ko">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="라이더-웨이트 78장 타로, 만세력 사주, 궁합, 별자리·수비학을 전통 계산법으로 보는 운세">
<meta property="og:title" content="쪼꼬미 운세">
<meta property="og:description" content="오늘의 카드, 타로 리딩, 사주팔자, 궁합, 별자리">
<meta property="og:image" content="cards/back.webp">
<link rel="icon" href="cards/back.webp">
<meta charset="utf-8">
<title>쪼꼬미 운세</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0a0918; --bg2:#141130; --panel:rgba(28,24,62,.62); --panel-solid:#1b1840; --line:rgba(232,195,114,.22);
  --gold:#e8c372; --gold2:#f6e2a8; --text:#efeaff; --muted:#a9a2cc; --lav:#b9a6ff; --rose:#ff8fb1;
  --wood:#5fd38d; --fire:#ff6f6f; --earth:#e3b45c; --metal:#d7dbe6; --water:#5aa9ff;
  --good:#7be0a8; --bad:#ff8f8f;
  --radius:18px; --gutter:max(16px, env(safe-area-inset-left)); --gutter-r:max(16px, env(safe-area-inset-right));
  --navh:64px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.bgimg{position:fixed;inset:-4%;z-index:0;pointer-events:none;background:url(cards/bg.webp) center/cover no-repeat;opacity:.9;animation:bgdrift 90s ease-in-out infinite alternate}
@keyframes bgdrift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.06) translate(-1.2%,-.8%)}}
@media (prefers-reduced-motion:reduce){.bgimg{animation:none}}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.nebula{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:
  radial-gradient(40% 30% at 20% 15%, rgba(123,92,255,.22), transparent 70%),
  radial-gradient(35% 30% at 85% 30%, rgba(255,143,177,.12), transparent 70%),
  radial-gradient(50% 40% at 50% 100%, rgba(232,195,114,.10), transparent 70%)}
.wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:0 var(--gutter-r) calc(var(--navh) + 40px) var(--gutter)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 35%,#fff6d8,#e8c372 45%,#8a6a2a);box-shadow:0 0 24px rgba(232,195,114,.55)}
.brand b{font-family:"Gowun Batang",serif;font-size:1.25rem;letter-spacing:.02em}
.brand small{display:block;font-family:Cinzel,serif;font-size:.62rem;letter-spacing:.32em;color:var(--gold);margin-top:-4px}
.me-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:999px;font:inherit;font-size:.88rem;cursor:pointer;backdrop-filter:blur(8px)}
.me-btn:hover{border-color:var(--gold)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));background:rgba(12,10,32,.88);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav.tabs .in{display:flex;width:100%;max-width:560px;justify-content:space-between}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;border-radius:12px;position:relative}
nav.tabs button .i{font-size:1.3rem;line-height:1.1;filter:grayscale(.5);transition:transform .45s cubic-bezier(.22,.61,.36,1), filter .45s ease}
nav.tabs button.on{color:var(--gold2)}
nav.tabs button.on .i{filter:none;transform:translateY(-2px) scale(1.12)}
nav.tabs button.on::after{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:3px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
@media (min-width:760px){
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);background:rgba(12,10,32,.7)}
  nav.tabs button{flex-direction:row;justify-content:center;font-size:.92rem;gap:8px;padding:10px}
  nav.tabs button.on::after{top:auto;bottom:-6px}
  .wrap{padding-bottom:60px}
}
section.page{display:none;padding-top:10px}
section.page.on{display:block}
h1,h2,h3{font-family:"Gowun Batang",serif;font-weight:700;margin:0}
h1{font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.25}
h2{font-size:1.25rem;margin-bottom:10px}
h3{font-size:1.05rem}
.eyebrow{font-family:Cinzel,serif;font-size:.7rem;letter-spacing:.3em;color:var(--gold)}
.lead{color:var(--muted);margin:6px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;backdrop-filter:blur(10px);margin-top:16px}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;padding:12px 22px;color:#2a1d05;background:linear-gradient(135deg,#fff1c4,#e8c372 45%,#c99a3e);box-shadow:0 6px 24px rgba(232,195,114,.35), inset 0 1px 0 rgba(255,255,255,.6);transition:transform .4s cubic-bezier(.22,.61,.36,1), box-shadow .5s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(232,195,114,.5)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold)}
.btn.sm{padding:8px 14px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.78rem;background:rgba(185,166,255,.14);color:var(--lav);border:1px solid rgba(185,166,255,.25)}
.chip.gold{background:rgba(232,195,114,.12);color:var(--gold2);border-color:var(--line)}
.chip.good{background:rgba(123,224,168,.12);color:var(--good);border-color:rgba(123,224,168,.3)}
.chip.bad{background:rgba(255,143,143,.12);color:var(--bad);border-color:rgba(255,143,143,.3)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
b.hl{color:var(--gold2)}
/* form */
label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.field{flex:1;min-width:0}
select,input[type=text],input[type=time]{width:100%;font:inherit;color:var(--text);background:rgba(10,9,24,.6);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;appearance:none;-webkit-appearance:none}
input[type=time]{color-scheme:dark;min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
select option{background:#1b1840}
select:focus,input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,195,114,.15)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;color:var(--muted);font:inherit;padding:10px;cursor:pointer}
.seg button.on{background:rgba(232,195,114,.18);color:var(--gold2);font-weight:700}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.fgrid .full{grid-column:1/-1}
/* flip card */
.card3d{perspective:1000px}
.card3d .inner{position:relative;width:100%;aspect-ratio:300/514;transform-style:preserve-3d}
.card3d img{position:absolute;inset:0;width:100%;height:100%;border-radius:8%/4.7%;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.card3d .face{transform:rotateY(180deg)}
.card3d .face.rev{transform:rotateY(180deg) rotate(180deg)}
#dailyCard{transition:filter 1.8s ease}
.glow{filter:drop-shadow(0 0 18px rgba(232,195,114,.45))}
/* today */
.hero{display:grid;gap:20px;align-items:center;grid-template-columns:1fr}
@media (min-width:760px){.hero{grid-template-columns:260px 1fr}}
.daily-card{width:min(220px,58vw);margin:6px auto 0;cursor:pointer;position:relative}
.daily-card .hint{position:absolute;left:0;right:0;bottom:-30px;text-align:center;font-size:.85rem;color:var(--gold2);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.stars-row{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-top:10px}
.stars{letter-spacing:2px;color:rgba(255,255,255,.18);font-size:1.05rem}
.stars i{font-style:normal;display:inline-block}
.stars i.on{color:var(--gold);text-shadow:0 0 8px rgba(232,195,114,.7)}
.lucky{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.lucky div{flex:1;min-width:120px;padding:10px 12px;border-radius:14px;background:rgba(10,9,24,.5);border:1px solid var(--line)}
.lucky small{display:block;color:var(--muted);font-size:.75rem}
.lucky b{font-size:1.1rem}
.cta{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* tarot */
.spreads{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-top:16px}
@media (min-width:760px){.spreads{grid-template-columns:repeat(4,1fr)}}
.spread{cursor:pointer;text-align:left;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;transition:transform .45s cubic-bezier(.22,.61,.36,1),border-color .45s ease, box-shadow .5s ease;position:relative;overflow:hidden}
.spread:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 10px 30px rgba(123,92,255,.25)}
.spread .ic{font-size:1.7rem}
.spread b{display:block;font-family:"Gowun Batang",serif;font-size:1.05rem;margin:6px 0 2px}
.spread span{font-size:.8rem;color:var(--muted)}
.spread .n{position:absolute;right:12px;top:10px;font-family:Cinzel,serif;color:var(--gold);font-size:.75rem}
.table{position:relative;margin-top:16px;border-radius:24px;padding:18px 12px 14px;background:radial-gradient(120% 90% at 50% 0%, rgba(123,92,255,.22), rgba(20,17,48,.85) 60%);border:1px solid var(--line);overflow:hidden}
.table .q{text-align:center;font-family:"Gowun Batang",serif;color:var(--gold2);min-height:1.5em}
.slots{display:grid;gap:10px;justify-content:center;margin:12px auto 0;grid-template-columns:repeat(var(--cols),minmax(0,var(--sw)))}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.slot .ph{width:100%;aspect-ratio:300/514;border-radius:8%/4.7%;border:1.5px dashed rgba(232,195,114,.35);display:grid;place-items:center;color:rgba(232,195,114,.5);font-family:Cinzel,serif;font-size:.8rem;position:relative}
.slot .ph .card3d{position:absolute;inset:0}
.slot .lbl{font-size:.74rem;color:var(--muted);text-align:center;line-height:1.25;min-height:2.5em}
.slot.done .lbl{color:var(--gold2)}
.slots.celtic{grid-template-columns:repeat(4,minmax(0,var(--sw)));grid-template-areas:". c3 . s10" "c5 c1 c6 s9" ". c4 . s8" ". . . s7";}
.fan{position:relative;margin-top:18px;touch-action:manipulation}
.fan .fc{position:absolute;left:50%;bottom:8px;width:var(--cw);margin-left:calc(var(--cw) / -2);aspect-ratio:300/514;cursor:pointer;border-radius:8%/4.7%;background:url(cards/back.webp) center/cover;box-shadow:0 6px 16px rgba(0,0,0,.55);border:1px solid rgba(232,195,114,.35);will-change:transform;transition:filter .45s ease}
@media (hover:hover){.fan .fc:hover{filter:brightness(1.2)}}
.fan-hint{text-align:center;color:var(--muted);font-size:.86rem;margin-top:10px;min-height:1.4em;line-height:1.4;padding:0 8px;transition:opacity .5s ease}
.reading{margin-top:18px;display:grid;gap:12px}
.rcard{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:14px;border-radius:16px;background:rgba(10,9,24,.55);border:1px solid var(--line)}
.rcard img{width:72px;border-radius:6px;cursor:zoom-in}
.rcard img.rev{transform:rotate(180deg)}
.rcard .pos{font-size:.75rem;color:var(--gold);font-family:Cinzel,"Noto Sans KR",serif;letter-spacing:.08em}
.rcard h3{margin:2px 0 6px}
.rcard p{margin:6px 0 0;font-size:.93rem}
.topic{margin:8px 0 0!important;padding:8px 10px;border-radius:10px;background:rgba(232,195,114,.08);border:1px solid var(--line);font-size:.88rem}
.topic .stars{font-size:.85rem}
.rcard .adv{color:var(--gold2);font-size:.88rem}
.verdict{text-align:center;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(232,195,114,.18),rgba(123,92,255,.18));border:1px solid var(--line)}
.verdict b{display:block;font-family:"Gowun Batang",serif;font-size:2rem;color:var(--gold2)}
.dict-filter{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.dict{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.dict button{background:none;border:0;padding:0;cursor:pointer;color:var(--text);font:inherit;font-size:.72rem;text-align:center}
.dict img{width:100%;border-radius:6px;display:block;margin-bottom:3px;transition:transform .45s cubic-bezier(.22,.61,.36,1)}
.dict button:hover img{transform:translateY(-3px) scale(1.03)}
/* saju */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pcol{text-align:center}
.pcol .ph2{font-size:.75rem;color:var(--muted)}
.tile{border-radius:14px;padding:8px 2px 6px;margin:4px 0;border:1px solid rgba(255,255,255,.08);position:relative}
.tile .hj{font-family:"Gowun Batang",serif;font-size:clamp(1.6rem,7vw,2.4rem);line-height:1.1;font-weight:700}
.tile .kr{font-size:.72rem;opacity:.85}
.tile.unknown{border:1.5px dashed rgba(255,255,255,.18);background:transparent;color:var(--muted)}
.god{font-size:.72rem;color:var(--lav)}
.god.me{color:var(--gold2);font-weight:700}
.e0{background:linear-gradient(160deg,rgba(95,211,141,.32),rgba(95,211,141,.08));color:#c9f5da}
.e1{background:linear-gradient(160deg,rgba(255,111,111,.32),rgba(255,111,111,.08));color:#ffd6d6}
.e2{background:linear-gradient(160deg,rgba(227,180,92,.34),rgba(227,180,92,.08));color:#ffe9bf}
.e3{background:linear-gradient(160deg,rgba(215,219,230,.30),rgba(215,219,230,.06));color:#f4f6fb}
.e4{background:linear-gradient(160deg,rgba(90,169,255,.32),rgba(90,169,255,.08));color:#d4e8ff}
.bars{display:grid;gap:9px;margin-top:6px}
.bar{display:grid;grid-template-columns:52px 1fr 28px;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:12px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar .fill{height:100%;width:0;border-radius:99px}
.meter{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,#5aa9ff,#7be0a8 50%,#ff8f6f);margin:16px 0 6px}
.meter .knob{position:absolute;top:50%;left:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.2),0 0 16px rgba(255,255,255,.6)}
.meter-l{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.godg{display:grid;gap:10px}
.godg div{padding:10px 12px;border-radius:12px;background:rgba(10,9,24,.45);border:1px solid rgba(255,255,255,.06);font-size:.88rem}
.empty{text-align:center;padding:34px 18px}
.empty .big{font-size:2.6rem}
/* love */
.ring{position:relative;width:200px;height:200px;margin:4px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{font-family:Cinzel,serif;font-size:3rem;line-height:1;color:var(--gold2)}
.items{display:grid;gap:8px;margin-top:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-radius:12px;background:rgba(10,9,24,.45);border:1px solid rgba(255,255,255,.06)}
.item .t{font-weight:700;font-size:.9rem}
.item .d{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.pyr{display:grid;gap:6px;justify-items:center;margin-top:10px}
.pyr .r{display:flex;gap:6px}
.pyr span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:Cinzel,serif;font-weight:700;font-size:.9rem;background:rgba(255,143,177,.14);border:1px solid rgba(255,143,177,.3)}
.pyr .letters span{background:rgba(232,195,114,.14);border-color:var(--line);font-family:"Gowun Batang",serif}
.pyr .last span{background:linear-gradient(135deg,#ff8fb1,#e8c372);color:#2a1020;border:0}
/* stars page */
.sign{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.glyph{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:2.8rem;background:radial-gradient(circle,rgba(232,195,114,.25),rgba(123,92,255,.12) 60%,transparent 70%);border:1px solid var(--line);color:var(--gold2);font-family:"Segoe UI Symbol","Noto Sans Symbols",serif}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem;margin-top:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.lp{font-family:Cinzel,serif;font-size:3.2rem;color:var(--gold2);line-height:1;text-shadow:0 0 20px rgba(232,195,114,.5)}
/* sheet & modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,4,14,.72);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
@media (min-width:640px){.overlay{align-items:center}}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#221d4f,#14112f);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px var(--gutter-r) calc(22px + env(safe-area-inset-bottom)) var(--gutter)}
@media (min-width:640px){.sheet{border-radius:24px}}
.sheet .close{float:right;background:none;border:0;color:var(--muted);font-size:1.4rem;cursor:pointer}
.cardview{max-width:760px;width:100%}
.cardview .in{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:640px){.cardview .in{grid-template-columns:240px 1fr}}
.cardview img{width:min(240px,60vw);margin:0 auto;display:block;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 20px);transform:translateX(-50%);z-index:60;background:var(--panel-solid);border:1px solid var(--gold);color:var(--gold2);padding:10px 18px;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .5s ease}
.toast.on{opacity:1}
.fly{position:fixed;z-index:40;pointer-events:none;will-change:transform,left,top;border-radius:8%/4.7%;background:url(cards/back.webp) center/cover;box-shadow:0 14px 30px rgba(0,0,0,.6)}
.basis{margin:12px 0 0;font-size:.74rem;color:var(--muted);border-top:1px dashed rgba(232,195,114,.18);padding-top:8px;line-height:1.5}
.basis::before{content:"📜 "}
footer{margin-top:30px;text-align:center;font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="bgimg"></div><canvas id="sky"></canvas><div class="nebula"></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="mark">✦</div><div><b>쪼꼬미 운세</b><small>CHOKKOMI FORTUNE</small></div></div>
    <button class="me-btn" id="meBtn">🌙 <span id="meLabel">내 정보 입력</span></button>
  </header>
</div>
<nav class="tabs"><div class="in">
  <button data-tab="today"><span class="i">🌅</span>오늘</button>
  <button data-tab="tarot"><span class="i">🃏</span>타로</button>
  <button data-tab="saju"><span class="i">🀄</span>사주</button>
  <button data-tab="love"><span class="i">💞</span>궁합</button>
  <button data-tab="stars"><span class="i">✨</span>별자리</button>

      } },
    // 카드 공개: 주변이 살짝 흐려지고 → 빛이 스며들고 → 반짝임이 대각선으로 '샤르르' 쓸고 지나간 뒤 → 카드별 효과가 피어난다

  };

function renderStars(el) {
  const sj = sajuOf(me); if (!sj) { el.innerHTML = `<div class="eyebrow" style="margin-top:8px">별자리 · 수비학</div><h1 style="margin-top:6px">별자리 · 띠 · 숫자</h1>` + needMe("생일을 알려 주면 별자리를 찾아 줄게요"); return; }

  // 트랜싯: 지금 태양 황경과 태어날 때 태양 황경 사이 각도(애스펙트)
  const nowLon = SJ.sunLon(Date.now()), diff = SJ.mod(nowLon - sj.lon, 360), sep = Math.min(diff, 360 - diff);
  const ASP = [[0, "컨정션 (0°) · 태양 회귀", "태양이 태어날 때 자리로 돌아온 시기예요. 새 1년의 시작, 나를 다시 세우기 좋아요.", 5],

    [90, "스퀘어 (90°)", "긴장의 각도예요. 부딪히는 일이 있어도 그만큼 밀고 나갈 힘이 생겨요.", 2],

  el.innerHTML = `<div class="eyebrow" style="margin-top:8px">별자리 · 수비학</div><h1 style="margin-top:6px">별자리 · 띠 · 숫자</h1>

      <div class="lucky"><div style="flex:2"><small>요즘 태양 흐름 · 지금 태양 ${curSign[1]} ${curSign[0]} ${(nowLon % 30).toFixed(0)}°</small><b style="font-size:1rem">☀️ ${aspName}</b><small style="color:var(--text);font-size:.85rem">${aspText}</small></div><div><small>흐름 세기</small><b class="stars">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= sc ? "on" : ""}">★</i>`).join("")}</b></div></div>
      <p class="basis">근거 · 별자리: 태어난 시각의 태양 황경(트로피컬 황도대, 30°씩 12궁) · 태양 흐름: 오늘 태양과 출생 태양 사이 각도를 점성술의 5대 애스펙트(오브 ±8°)로 판정</p></div>

      <div class="panel"><div class="eyebrow">나의 띠</div><h2 style="margin-top:4px">${SJ.ZODIAC_EMOJI[sj.year.b]} ${SJ.ZODIAC[sj.year.b]}띠 · ${SJ.ptext(sj.year)}년</h2><p style="margin:0">${ZODIAC_TEXT[sj.year.b]}</p>
        <p class="muted small" style="margin:8px 0 0">띠는 1월 1일이 아니라 입춘(2월 4일 무렵)에 바뀌어요. 1~2월 초에 태어났다면 앞 해의 띠일 수 있어요.</p></div>
      <div class="panel"><div class="eyebrow">생명수 (라이프 패스)</div><div class="row" style="gap:16px"><div class="lp" id="lpNum">${lp}</div><div><h2 style="margin:0">${L[0]}</h2><span class="muted small">생년월일 숫자를 모두 더해 한 자리로 (11·22·33은 그대로)</span></div></div><p style="margin:8px 0 0">${L[1]}</p><p class="basis">근거 · 피타고라스식 수비학: 생년월일 숫자를 모두 더해 한 자리로 줄이는 생명수(마스터 넘버 11·22·33 유지)</p></div>

// ---------- 화면 전환
const PAGES = { today: renderToday, tarot: renderTarot, saju: renderSaju, love: renderLove, stars: renderStars };
const rendered = new Set(); let current = null;
function show(tab, force) {
  if (!PAGES[tab]) tab = "today";
  $$("nav.tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  $$("section.page").forEach((s) => s.classList.toggle("on", s.id === "p-" + tab));
  const el = $("#p-" + tab);
  if (!rendered.has(tab) || force) { PAGES[tab](el); rendered.add(tab); }
  if (current !== tab || force) G.fromTo(el, { opacity: 0, y: 8, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "sine.out", clearProps: "filter" });
  current = tab; store.set("tab", tab);
}
function go(tab) { show(tab); scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" }); }
$$("nav.tabs button").forEach((b) => b.onclick = () => go(b.dataset.tab));
